<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- PWA (v2.42.0): manifest + íconos + los meta tags que necesita iOS específicamente,
         que no lee manifest.json para "Agregar a inicio" -- sin apple-touch-icon y
         apple-mobile-web-app-capable, un iPhone instala un simple acceso directo a la web sin
         ícono propio ni modo standalone (se abre dentro de Safari con toda su interfaz). -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#16325C" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pickle Hub" />
    <title>Pickle Hub</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
